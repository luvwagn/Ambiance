name: Publish Aminet release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build Aminet upload
    if: ${{ !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v') }}
    runs-on: ubuntu-latest
    container: stefanreinauer/amiga-gcc:16.2-rc23

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          submodules: recursive

      - name: Mark git directory as safe
        run: git config --global --add safe.directory '*'

      - name: GCC 16.2-rc24 (AmigaPorts' m68k-amigaos-gcc), ahead of the image's
        shell: bash
        run: |
          set -euo pipefail
          url=https://github.com/AmigaPorts/m68k-amigaos-gcc/releases/download/v16.2-rc24/m68k-amigaos-gcc-16.2-rc24-x86_64-linux.tar.xz
          curl -fsSL -o /tmp/gcc.tar.xz "$url"
          echo "b93b070ac47d2f01d126f57c03a8405f71fb470c8397b0bda51041217d25c100  /tmp/gcc.tar.xz" | sha256sum -c -
          mkdir -p /opt/gcc-rc24 && tar xJf /tmp/gcc.tar.xz -C /opt/gcc-rc24 --strip-components=1
          rm /tmp/gcc.tar.xz
          echo /opt/gcc-rc24/bin >> "$GITHUB_PATH"
          /opt/gcc-rc24/bin/m68k-amigaos-gcc --version | head -1

      - name: Build all artifacts
        run: make all

      - name: Prepare Aminet upload files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t lha_files < <(find . -maxdepth 1 -type f -name 'amigamce-*.lha' -printf '%f\n' | sort)
          if [ "${#lha_files[@]}" -ne 1 ]; then
            echo "::error::Expected one amigamce-*.lha archive, found ${#lha_files[@]}"
            exit 1
          fi
          cp "${lha_files[0]}" dist/AmigaMCE.lha
          cp AmigaMCE.readme dist/AmigaMCE.readme

      - name: Upload Aminet artifact
        uses: actions/upload-artifact@v4
        with:
          name: aminet-upload
          path: |
            dist/AmigaMCE.lha
            dist/AmigaMCE.readme
          if-no-files-found: error

  publish:
    name: Upload to Aminet
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Aminet artifact
        uses: actions/download-artifact@v4
        with:
          name: aminet-upload
          path: dist

      - name: Upload to Aminet
        uses: sidick/aminet-release-action@v1
        with:
          filename: dist/AmigaMCE.lha
          readme: dist/AmigaMCE.readme
          category: util/wb
          inject-version: true
