name: AmigaMCE Draft Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write  # needed for creating GitHub releases

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    container: stefanreinauer/amiga-gcc:16.2-rc23

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Mark git directory as safe
        run: git config --global --add safe.directory '*'

      - name: GCC 16.2-rc24 (AmigaPorts' m68k-amigaos-gcc), ahead of the image's
        shell: bash
        run: |
          set -euo pipefail
          url=https://github.com/AmigaPorts/m68k-amigaos-gcc/releases/download/v16.2-rc24/m68k-amigaos-gcc-16.2-rc24-x86_64-linux.tar.xz
          curl -fsSL -o /tmp/gcc.tar.xz "$url"
          echo "b93b070ac47d2f01d126f57c03a8405f71fb470c8397b0bda51041217d25c100  /tmp/gcc.tar.xz" | sha256sum -c -
          mkdir -p /opt/gcc-rc24 && tar xJf /tmp/gcc.tar.xz -C /opt/gcc-rc24 --strip-components=1
          rm /tmp/gcc.tar.xz
          echo /opt/gcc-rc24/bin >> "$GITHUB_PATH"
          /opt/gcc-rc24/bin/m68k-amigaos-gcc --version | head -1

      - name: Build all artifacts
        run: make all && make test

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            AmigaMCE
            amigamce-*.lha
          if-no-files-found: error

  release:
    name: Create GitHub Draft Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            artifacts/amigamce-*.lha
