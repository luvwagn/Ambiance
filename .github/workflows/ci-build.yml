name: AmigaMCE CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: stefanreinauer/amiga-gcc:16.2-rc23

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Mark git directory as safe
      run: git config --global --add safe.directory '*'

    - name: GCC 16.2-rc24 (AmigaPorts' m68k-amigaos-gcc), ahead of the image's
      shell: bash
      run: |
        set -euo pipefail
        url=https://github.com/AmigaPorts/m68k-amigaos-gcc/releases/download/v16.2-rc24/m68k-amigaos-gcc-16.2-rc24-x86_64-linux.tar.xz
        curl -fsSL -o /tmp/gcc.tar.xz "$url"
        echo "b93b070ac47d2f01d126f57c03a8405f71fb470c8397b0bda51041217d25c100  /tmp/gcc.tar.xz" | sha256sum -c -
        mkdir -p /opt/gcc-rc24 && tar xJf /tmp/gcc.tar.xz -C /opt/gcc-rc24 --strip-components=1
        rm /tmp/gcc.tar.xz
        echo /opt/gcc-rc24/bin >> "$GITHUB_PATH"
        /opt/gcc-rc24/bin/m68k-amigaos-gcc --version | head -1

    - name: Build program and LHA
      run: make all

    - name: Build zzprobe (the ZZ9000 probe and bench)
      run: make zzprobe

    - name: Run AGS parser tests
      run: make test

    - name: Find release filenames
      id: files
      run: |
        echo "lha=$(ls amigamce-*.lha)" >> $GITHUB_OUTPUT

    - name: Archive program
      uses: actions/upload-artifact@v4
      with:
        name: AmigaMCE Program
        path: AmigaMCE

    - name: Archive zzprobe
      uses: actions/upload-artifact@v4
      with:
        name: zzprobe
        path: |
          build/zzprobe
          tools/zzprobe/Bench

    - name: Archive dvdnav.library (DVD navigation, GPL-3.0-or-later, github.com/luvwagn/dvdnav.library)
      uses: actions/upload-artifact@v4
      with:
        name: dvdnav.library
        path: |
          extras/dvdnav/build/dvdnav.library
          build/dvd/dvd_68k
          extras/dvdnav/README.md

    - name: Archive LHA
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.files.outputs.lha }}
        path: ${{ steps.files.outputs.lha }}
