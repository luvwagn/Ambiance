name: AmigaMCE CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: stefanreinauer/amiga-gcc:16.2-rc23

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Mark git directory as safe
      run: git config --global --add safe.directory '*'

    - name: Build program and LHA
      run: make all

    - name: Build zzprobe (the ZZ9000 probe and bench)
      run: make zzprobe

    - name: Run AGS parser tests
      run: make test

    - name: Find release filenames
      id: files
      run: |
        echo "lha=$(ls amigamce-*.lha)" >> $GITHUB_OUTPUT

    - name: Archive program
      uses: actions/upload-artifact@v4
      with:
        name: AmigaMCE Program
        path: AmigaMCE

    - name: Archive JPEG datatype
      uses: actions/upload-artifact@v4
      with:
        name: amcejpeg.datatype
        path: |
          build/amcejpeg/amcejpeg.datatype
          build/amcejpeg/AmigaMCE-JPEG
          build/amcejpeg/dtjpeg
          datatypes/jpeg/README.md

    - name: Archive zzprobe
      uses: actions/upload-artifact@v4
      with:
        name: zzprobe
        path: |
          build/zzprobe
          tools/zzprobe/Bench

    - name: Archive amcedvd.library (DVD navigation, GPL-2.0-or-later: src/dvdlib/README)
      uses: actions/upload-artifact@v4
      with:
        name: amcedvd.library
        path: |
          build/dvdlib/amcedvd.library
          build/dvd/dvd_68k
          src/dvdlib/README

    - name: Archive LHA
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.files.outputs.lha }}
        path: ${{ steps.files.outputs.lha }}
